    function mostrarTela(id) {
        document.querySelectorAll('.container > div').forEach(div => { if(div.id) div.classList.add('hidden'); });
        if(['tela-selecao','tela-formulario'].includes(id)) document.getElementById('header-logado').classList.remove('hidden');
        else document.getElementById('header-logado').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }

    function alternarAba(aba) {
        abaAtual = aba;
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + aba).classList.add('active');
        const f = document.getElementById('form-selecao');
        f.classList.remove('hidden');
        document.getElementById('resultados-consulta').classList.add('hidden');
        if(aba === 'dash') { f.classList.add('hidden'); carregarDashboard(); }
        document.getElementById('campos-aluno').classList.toggle('hidden', aba==='dia' || aba==='dash');
        document.getElementById('campo-data').classList.toggle('hidden', aba!=='dia');
        document.getElementById('btn-acao-principal').innerText = aba==='dia' ? 'BUSCAR OCORRÊNCIAS DO DIA' : (aba==='registro' ? 'AVANÇAR PARA REGISTRO' : 'BUSCAR HISTÓRICO');
    }

    function atualizarTurmas() {
        const m = document.getElementById('modalidade').value;
        const s = document.getElementById('turma');
        s.innerHTML = '<option value="">Selecione...</option>';
        if(m) Object.keys(dadosEscola[m]).forEach(t => s.innerHTML += `<option value="${t}">${t}</option>`);
    }

    function atualizarAlunos() {
        const m = document.getElementById('modalidade').value;
        const t = document.getElementById('turma').value;
        const s = document.getElementById('aluno');
        s.innerHTML = '<option value="">Selecione...</option>';
        if(m && t) dadosEscola[m][t].sort().forEach(a => s.innerHTML += `<option value="${a}">${a}</option>`);
    }

    async function acaoLogin() {
        const e = document.getElementById('login-email').value;
        const s = document.getElementById('login-senha').value;
        const { data, error } = await _supabase.auth.signInWithPassword({ email: e, password: s });
        if (error) alert("Erro de login!"); else { professorLogado = data.user.email; mostrarTela('tela-selecao'); alternarAba('individual'); }
    }

    async function acaoCadastro() {
        const e = document.getElementById('cad-email').value;
        const s = document.getElementById('cad-senha').value;
        const { error } = await _supabase.auth.signUp({ email: e, password: s });
        if (error) alert(error.message); else { alert("Cadastrado! Verifique e-mail."); mostrarTela('tela-login'); }
    }

    async function solicitarReset() {
        const e = prompt("E-mail:"); if(e) await _supabase.auth.resetPasswordForEmail(e); alert("Link enviado!");
    }

    async function acaoSair() { await _supabase.auth.signOut(); window.location.reload(); }

    async function acaoBotaoPrincipal() {
        const aluno = document.getElementById('aluno').value;
        const dataFiltro = document.getElementById('filtro-data').value;
        if(abaAtual === 'registro') {
            if(!aluno) return alert("Selecione um aluno.");
            document.getElementById('nome-aluno-confirmado').innerText = aluno;
            mostrarTela('tela-formulario');
        } else if (abaAtual === 'individual') {
            const { data } = await _supabase.from('ocorrencias').select('*').eq('aluno', aluno).order('id', { ascending: false });
            exibirResultados(data, `Histórico: ${aluno}`);
        } else if (abaAtual === 'dia') {
            const df = dataFiltro.split('-').reverse().join('/');
            const { data } = await _supabase.from('ocorrencias').select('*').like('data_hora', `%${df}%`).order('id', { ascending: false });
            exibirResultados(data, `Busca por data: ${df}`);
        }
    }

    function exibirResultados(dados, titulo) {
        document.getElementById('form-selecao').classList.add('hidden');
        document.getElementById('resultados-consulta').classList.remove('hidden');
        const lista = document.getElementById('lista-ocorrencias-aluno');
        
        let htmlResumo = "";
        if (abaAtual === "individual") {
            const contagemMeses = {};
            const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            dados.forEach(oc => {
                const parteData = oc.data_hora.split(' ')[0]; 
                const mesIndice = parseInt(parteData.split('/')[1]) - 1;
                contagemMeses[nomesMeses[mesIndice]] = (contagemMeses[nomesMeses[mesIndice]] || 0) + 1;
            });
            htmlResumo = `<div class="resumo-mensal"><b>📊 INDISCIPLINAS REGISTRADAS:</b><br>`;
            if (dados.length === 0) htmlResumo += "Nenhum registro encontrado.";
            else nomesMeses.forEach(m => { if(contagemMeses[m]) htmlResumo += `<span class="mes-item"><b>${m}:</b> ${contagemMeses[m]}</span>`; });
            htmlResumo += `</div>`;
        }

        lista.innerHTML = `<h3>${titulo}</h3>` + htmlResumo;
        if(dados.length === 0) return;
        dados.forEach(oc => {
            lista.innerHTML += `
                <div class="card-ocorrencia">
                    <b>🎓 Aluno:</b> ${oc.aluno}<br>
                    <b>📚 Turma:</b> ${oc.turma}<br>
                    <b>📅 Data:</b> ${oc.data_hora}<br>
                    <b>⚠️ Ocorrência:</b> ${oc.tipos_selecionados.replace(/ \| /g, ', ')}<br>
                    <b>⚖️ Medida Adotada:</b> ${oc.penalidades || 'Não informada'}<br>
                    <b>👤 Registrado por:</b> ${oc.professor}<br>
                    <hr><a href="${oc.url_pdf}" target="_blank" class="btn-pdf-link">📄 VER DOCUMENTO ORIGINAL</a>
                </div>`;
        });
    }

    async function carregarDashboard() {
        const lista = document.getElementById('lista-ocorrencias-aluno');
        document.getElementById('resultados-consulta').classList.remove('hidden');
        lista.innerHTML = "<h4>Carregando estatísticas...</h4>";
        const { data } = await _supabase.from('ocorrencias').select('turma, tipos_selecionados');
        const ctTurmas = {}; const ctTipos = {};
        data.forEach(oc => {
            ctTurmas[oc.turma] = (ctTurmas[oc.turma] || 0) + 1;
            if(oc.tipos_selecionados) oc.tipos_selecionados.split(' | ').forEach(t => { if(t) ctTipos[t] = (ctTipos[t] || 0) + 1; });
        });
        const topTurmas = Object.entries(ctTurmas).sort((a,b) => b[1] - a[1]).slice(0, 3);
        const topTipos = Object.entries(ctTipos).sort((a,b) => b[1] - a[1]).slice(0, 3);
        let h = `<h3>📊 Estatísticas Gerais</h3><div class="dash-container">`;
        h += `<div class="dash-card"><span class="dash-title">Total de Ocorrências</span><span class="dash-value">${data.length}</span></div>`;
        h += `<div class="dash-card"><span class="dash-title">🚩 Top Turmas</span><span class="dash-value" style="font-size:0.9rem">${topTurmas.map(t=>`${t[0]} (${t[1]})`).join(' | ')}</span></div>`;
        h += `<div class="dash-card"><span class="dash-title">⚠️ Principais Motivos</span><span class="dash-value" style="font-size:0.9rem">${topTipos.map(t=>`${t[0]} (${t[1]})`).join('<br>')}</span></div>`;
        h += `</div>`;
        lista.innerHTML = h;
    }

    function limparConsulta() { document.getElementById('form-selecao').classList.remove('hidden'); document.getElementById('resultados-consulta').classList.add('hidden'); }
    function novaOcorrencia() { document.getElementById('descricao').value = ""; document.querySelectorAll('#tipos-ocorrencia input').forEach(c => c.checked = false); mostrarTela('tela-selecao'); alternarAba('registro'); }
    function carregarImagem(src) { return new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = reject; img.src = src; }); }

    async function gerarEEnviar() {
        const aluno = document.getElementById('nome-aluno-confirmado').innerText;
        const turma = document.getElementById('turma').value;
        const fone = document.getElementById('whatsapp-fone').value;
        const obs = document.getElementById('descricao').value;
        const agr = document.getElementById('houve-agressao').value;
        const pen = document.getElementById('penalidades').value;

        if(!fone) return alert("WhatsApp obrigatório.");
        const btn = document.getElementById('btn-finalizar');
        btn.innerText = "PROCESSANDO..."; btn.disabled = true;

        const agora = new Date();
        const dataF = agora.toLocaleDateString('pt-BR');
        const horaF = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        let selecionados = [];
        document.querySelectorAll('#tipos-ocorrencia input:checked').forEach(c => selecionados.push(c.getAttribute('data-label')));
        const textoParaBanco = selecionados.join(' | ');

        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const margin = 15;
            
            // Cabeçalho Profissional
            doc.setFillColor(26, 73, 144); doc.rect(0, 0, 210, 45, 'F');
            try { const logo = await carregarImagem('imagem1.png'); doc.addImage(logo, 'PNG', 15, 5, 30, 30); } catch(e){}
            
            doc.setTextColor(255);
            doc.setFontSize(18); doc.setFont(undefined, 'bold');
            doc.text("EEMTI DRAGÃO DO MAR", 50, 20);
            doc.setFontSize(10); doc.setFont(undefined, 'normal');
            doc.text("Sistema de controle de ocorrências e indisciplinas", 50, 27);
            doc.text("Governo do Estado do Ceará - Secretaria da Educação", 50, 33);

            // Tabela de Identificação
            doc.autoTable({
                startY: 55,
                margin: { left: margin, right: margin },
                theme: 'grid',
                head: [['DADOS DE IDENTIFICAÇÃO', '']],
                body: [
                    ['ESTUDANTE:', aluno],
                    ['SÉRIE/TURMA:', turma],
                    ['DATA/HORA:', `${dataF} às ${horaF}`],
                    ['REGISTRADO POR:', professorLogado]
                ],
                headStyles: { fillColor: [26, 73, 144], textColor: 255, fontStyle: 'bold' },
                styles: { fontSize: 9, cellPadding: 3 }
            });

            let finalY = doc.lastAutoTable.finalY + 10;

            // Seção de Itens Marcados
            doc.setTextColor(26, 73, 144); doc.setFontSize(11); doc.setFont(undefined, 'bold');
            doc.text("INDISIPLINA(S) OBSERVADA(S):", margin, finalY);
            finalY += 7; doc.setTextColor(0); doc.setFontSize(10); doc.setFont(undefined, 'normal');
            const itens = selecionados.length > 0 ? selecionados : ["Nenhum item específico selecionado."];
            itens.forEach(item => { doc.text(`[X] ${item}`, margin + 5, finalY); finalY += 6; });

            // Descrição dos Fatos
            finalY += 5;
            doc.setTextColor(26, 73, 144); doc.setFontSize(11); doc.setFont(undefined, 'bold');
            doc.text("RELATO DOS FATOS:", margin, finalY);
            finalY += 7; doc.setTextColor(0); doc.setFontSize(10); doc.setFont(undefined, 'normal');
            const lines = doc.splitTextToSize(obs || "Sem observações adicionais.", 180);
            doc.text(lines, margin, finalY);
            finalY += (lines.length * 5) + 8;

            // Medidas Adotadas
            doc.setTextColor(26, 73, 144); doc.setFont(undefined, 'bold');
            doc.text(`AGRESSÃO:`, margin, finalY);
            doc.setTextColor(0); doc.setFont(undefined, 'normal'); doc.text(agr, margin + 28, finalY);
            finalY += 7;
            doc.setTextColor(26, 73, 144); doc.setFont(undefined, 'bold');
            doc.text(`MEDIDA ADOTADA:`, margin, finalY);
            doc.setTextColor(0); doc.setFont(undefined, 'normal'); doc.text(pen || "A informar", margin + 38, finalY);

            // Rodapé Profissional
            const pageHeight = doc.internal.pageSize.height;
            doc.setDrawColor(200); doc.line(margin, pageHeight - 20, 195, pageHeight - 20);
            doc.setFontSize(8); doc.setTextColor(100);
            doc.text("Versão BETA - Desenvolvido pelo L.E.I. (EEMTI DRAGÃO DO MAR) - Governo do Estado do Ceará", 105, pageHeight - 15, { align: "center" });

            // Envio e Salvar
            const pdfBase64 = doc.output('datauristring').split(',')[1];
            const resp = await fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: JSON.stringify({ "base64": pdfBase64, "nomeArquivo": `Ocorrencia_${aluno}.pdf` }) });
            const resJ = await resp.json();
            const linkDrive = resJ.url || "";

            await _supabase.from('ocorrencias').insert([{ aluno, turma, tipos_selecionados: textoParaBanco, observacoes: obs, agressao: agr, penalidades: pen, professor: professorLogado, data_hora: `${dataF} às ${horaF}`, url_pdf: linkDrive }]);

            const saudacao = `*📎EEMTI DRAGÃO DO MAR - NOTIFICAÇÃO DISCIPLINAR*%0A%0A📌 Olá, informamos um registro de indisciplina para *${aluno}* na escola *EEMTI DRAGÃO DO MAR*.%0A%0A`;
            const corpoMsg = `*🔎 DETALHES:*%0A*🎓 Aluno:* ${aluno}%0A*📆 Data:* ${dataF} às ${horaF}%0A*⚠️ Ocorrência(s):* ${selecionados.join(', ')}%0A%0A*⚖️ Medida:* ${pen}%0A%0A_Documento original arquivado na nuvem._`;
            const linkTexto = linkDrive ? `%0A%0A*📄 ACESSE O PDF COMPLETO AQUI:*%0A${linkDrive}` : "";
            
            window.open(`https://api.whatsapp.com/send?phone=55${fone}&text=${saudacao}${corpoMsg}${linkTexto}`, '_blank');
            doc.save(`Ocorrencia_${aluno}.pdf`);
            alert("Sucesso!");
            novaOcorrencia();
        } catch (e) { console.error(e); alert("Erro ao processar!"); } finally { btn.innerText = "💾SALVAR E ✅NOTIFICAR"; btn.disabled = false; }
    }
</script>
