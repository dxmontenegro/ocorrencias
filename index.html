    <div id="tela-cadastro" class="hidden">

    function renderizarCards(dados, tituloOpcional) {
        const podeExcluir = professorLogado === 'eem.dragao.mar@gmail.com';
        const lista = document.getElementById('lista-ocorrencias-aluno');
        const titulo = tituloOpcional || "Resultados";
        
        let htmlResumo = "";
        if (abaAtual === "individual") {
            const contagemMeses = {};
            const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            dadosAtuaisConsulta.forEach(oc => {
                const mesIndice = parseInt(oc.data_hora.split('/')[1]) - 1;
                contagemMeses[nomesMeses[mesIndice]] = (contagemMeses[nomesMeses[mesIndice]] || 0) + 1;
            });
            htmlResumo = `<div class="resumo-mensal"><b>📊 RESUMO ANUAL:</b><br>`;
            nomesMeses.forEach(m => { if(contagemMeses[m]) htmlResumo += `<span class="mes-item"><b>${m}:</b> ${contagemMeses[m]}</span>`; });
            htmlResumo += `</div>`;
        }

        lista.innerHTML = `<h3>${titulo}</h3>` + htmlResumo;
        if(dados.length === 0) { lista.innerHTML += "<p>Nenhum registro encontrado.</p>"; return; }

        dados.forEach(oc => {
              let classeG = '';
               let emojiG = '';

               if (oc.gravidade === 'Grave') {
                  classeG = 'card-grave';
                  emojiG = '🔴';
             } else if (oc.gravidade === 'Média') {
               classeG = 'card-media';
              emojiG = '🟠';
              } else {
               classeG = 'card-leve';
                    emojiG = '🟢';
                  }
            lista.innerHTML += `
                <div class="card-ocorrencia ${classeG}">
                    <span class="badge-gravidade">${emojiG}</span>
                    <b>🎓 Aluno:</b> ${oc.aluno} | <b>Turma:</b> ${oc.turma}<br>
                    <b>📅 Data:</b> ${oc.data_hora}<br>
                    <b>⚠️ Ocorrência:</b> ${oc.tipos_selecionados.replace(/ \| /g, ', ')}<br>
                    <b>⚖️ Medida Adotada:</b> ${oc.penalidades || 'Não registrada'}<br>
                    <hr><a href="${oc.url_pdf}" target="_blank" class="btn-pdf-link">📄 VER PDF</a>
                    ${podeExcluir ? `<button class="btn-excluir" onclick="excluirOcorrencia(${oc.id})">🗑️ EXCLUIR</button>` : ''}
                </div>`;
        });
    }

    function executarFiltroMes() {
        const mesNum = document.getElementById('select-filtro-mes').value;
        let filtrados = mesNum === 'Tudo' ? dadosAtuaisConsulta : dadosAtuaisConsulta.filter(oc => parseInt(oc.data_hora.split('/')[1]) === parseInt(mesNum));
        renderizarCards(filtrados);
    }

    async function carregarDashboard() {
        const lista = document.getElementById('lista-ocorrencias-aluno');
        document.getElementById('resultados-consulta').classList.remove('hidden');
        document.getElementById('filtro-meses-area').classList.add('hidden');
        lista.innerHTML = "<h4>Carregando estatísticas...</h4>";
        
        const { data } = await _supabase.from('ocorrencias').select('turma, tipos_selecionados');
        const ctTurmas = {}; const ctTipos = {};
        
        data.forEach(oc => {
            ctTurmas[oc.turma] = (ctTurmas[oc.turma] || 0) + 1;
            if(oc.tipos_selecionados) {
                oc.tipos_selecionados.split(' | ').forEach(t => { if(t) ctTipos[t] = (ctTipos[t] || 0) + 1; });
            }
        });

        const topTurmas = Object.entries(ctTurmas).sort((a,b) => b[1] - a[1]).slice(0, 3);
        const topTipos = Object.entries(ctTipos).sort((a,b) => b[1] - a[1]).slice(0, 5);

        let htmlTipos = `<ul class="dash-list">`;
        topTipos.forEach(t => htmlTipos += `<li><b>${t[1]}x</b> ${t[0]}</li>`);
        htmlTipos += `</ul>`;

        let htmlTurmas = `<ul class="dash-list">`;
        topTurmas.forEach(t => htmlTurmas += `<li><b>${t[0]}:</b> ${t[1]} ocorrências</li>`);
        htmlTurmas += `</ul>`;

        lista.innerHTML = `<h3>📊 Estatísticas Gerais</h3>
            <div class="dash-container">
                <div class="dash-card"><span class="dash-title">Total Geral</span><span class="dash-value">${data.length}</span></div>
                <div class="dash-card"><span class="dash-title">🏆 Top 3 Turmas Críticas</span>${htmlTurmas}</div>
                <div class="dash-card"><span class="dash-title">⚠️ Ocorrências mais Frequentes</span>${htmlTipos}</div>
            </div>`;
    }

    async function gerarEEnviar() {
        const aluno = document.getElementById('nome-aluno-confirmado').innerText;
        const turma = document.getElementById('turma').value;
        const fone = document.getElementById('whatsapp-fone').value;
        const obs = document.getElementById('descricao').value;
        const agr = document.getElementById('houve-agressao').value;
        const pen = document.getElementById('penalidades').value;

        let emojiG;

if (gravidade === 'Grave') {
    emojiG = '🔴 GRAVE';
} else if (gravidade === 'Média') {
    emojiG = '🟠 MÉDIA';
} else {
    emojiG = '🟢 LEVE';
}

        if(!fone) return alert("WhatsApp obrigatório.");
        const btn = document.getElementById('btn-finalizar');
        btn.innerText = "PROCESSANDO..."; btn.disabled = true;

        const agora = new Date();
        const dataF = agora.toLocaleDateString('pt-BR');
        const horaF = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        let selecionados = [];
        document.querySelectorAll('#tipos-ocorrencia input:checked').forEach(c => selecionados.push(c.getAttribute('data-label')));
        const textoParaBanco = selecionados.join(' | ');

        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let corPDF;

if (gravidade === 'Grave') {
    corPDF = [192, 57, 43]; // vermelho
} else if (gravidade === 'Média') {
    corPDF = [243, 156, 18]; // laranja
} else {
    corPDF = [26, 73, 144]; // azul (leve)
}
            
            // Cabeçalho Ajustado: Apenas Informações da Escola e Título do Sistema
            doc.setFillColor(corPDF[0], corPDF[1], corPDF[2]); doc.rect(0, 0, 210, 45, 'F');
            try { const logo = await carregarImagem('imagem1.png'); doc.addImage(logo, 'PNG', 15, 5, 30, 30); } catch(e){}
            doc.setTextColor(255); doc.setFontSize(18); doc.text("EEMTI DRAGÃO DO MAR", 50, 20);
            doc.setFontSize(12); doc.text("SISTEMA DE REGISTRO DE INDISCIPLINA", 50, 30);
            
            // Tabela com Gravidade (conforme solicitado)
            doc.autoTable({
                startY: 55,
                head: [['DADOS DA OCORRÊNCIA', '']],
                body: [
                    ['ESTUDANTE:', aluno],
                    ['SÉRIE/TURMA:', turma],
                    ['DATA/HORA:', `${dataF} às ${horaF}`],
                    ['CLASSIFICAÇÃO:', gravidade.toUpperCase()],
                    ['PROFESSOR:', professorLogado]
                ],
                headStyles: { fillColor: corPDF }
            });

            let finalY = doc.lastAutoTable.finalY + 10;
            doc.setTextColor(corPDF[0], corPDF[1], corPDF[2]); doc.setFontSize(11); doc.text("INDISCIPLINA(S):", 15, finalY);
            finalY += 7; doc.setTextColor(0); doc.setFontSize(10);
            selecionados.forEach(item => { doc.text(`- ${item}`, 20, finalY); finalY += 6; });
            
            finalY += 5;
            doc.setTextColor(corPDF[0], corPDF[1], corPDF[2]); doc.text("RELATO DOS FATOS:", 15, finalY);
            finalY += 7; doc.setTextColor(0);
            const lines = doc.splitTextToSize(obs || "Sem observações adicionais.", 180);
            doc.text(lines, 15, finalY);
            
            finalY += (lines.length * 5) + 10;
            doc.setTextColor(corPDF[0], corPDF[1], corPDF[2]); doc.text("MEDIDA ADOTADA:", 15, finalY);
            doc.setTextColor(0); doc.text(pen || "A informar", 60, finalY);

            const pdfBase64 = doc.output('datauristring').split(',')[1];
            const resp = await fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: JSON.stringify({ "base64": pdfBase64, "nomeArquivo": `Ocorrencia_${aluno}.pdf` }) });
            const resJ = await resp.json();
            const linkDrive = resJ.url || "";

            await _supabase.from('ocorrencias').insert([{ aluno, turma, tipos_selecionados: textoParaBanco, observacoes: obs, agressao: agr, penalidades: pen, professor: professorLogado, data_hora: `${dataF} às ${horaF}`, url_pdf: linkDrive, gravidade: gravidade }]);

            // Notificação WhatsApp (Mantida conforme solicitado)
            const saudacao = `*📎EEMTI DRAGÃO DO MAR - NOTIFICAÇÃO DISCIPLINAR*%0A%0A📌 Olá, informamos um registro de indisciplina para o aluno(a) *${aluno}*.%0A%0A`;
            const corpoMsg = `*🔎 DETALHES:*%0A*🎓 Aluno:* ${aluno}%0A*⚖️ Classificação:* ${emojiG}%0A*📆 Data:* ${dataF} às ${horaF}%0A*⚠️ Itens:* ${selecionados.join(', ')}%0A%0A*📝 RELATO:* ${obs || 'Não detalhado'}%0A%0A*⚖️ MEDIDA:* ${pen}%0A%0A_Documento original arquivado na nuvem._`;
            const linkTexto = linkDrive ? `%0A%0A*📄 ACESSE O PDF COMPLETO AQUI:*%0A${linkDrive}` : "";
            
            window.open(`https://api.whatsapp.com/send?phone=55${fone}&text=${saudacao}${corpoMsg}${linkTexto}`, '_blank');
            doc.save(`Ocorrencia_${aluno}.pdf`);
            alert("Salvo com sucesso!");
            novaOcorrencia();
        } catch (e) { alert("Erro ao salvar."); } finally { btn.innerText = "💾SALVAR E ✅NOTIFICAR"; btn.disabled = false; }
    }
    function mostrarAlerta(msg) {
    document.getElementById('mensagem-alerta').innerText = msg;
    document.getElementById('meu-alerta').classList.remove('hidden');
}

function fecharAlerta() {
    document.getElementById('meu-alerta').classList.add('hidden');
}
    async function excluirOcorrencia(id) {

    if (professorLogado !== 'eem.dragao.mar@gmail.com') {
        alert("Sem permissão!");
        return;
    }

    const confirmar = confirm("Deseja excluir esta ocorrência?");
    if (!confirmar) return;

    const { error } = await _supabase
        .from('ocorrencias')
        .delete()
        .eq('id', id);

    if (error) {
        alert("Erro ao excluir!");
        return;
    }

    dadosAtuaisConsulta = dadosAtuaisConsulta.filter(oc => oc.id !== id);
    renderizarCards(dadosAtuaisConsulta);

    alert("Excluído com sucesso!");
}
